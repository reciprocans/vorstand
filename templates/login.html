{% extends 'base.html' %}
{% block title %}Anmelden{% endblock %}
{% block content %}
<section class="card login-card">
  <h1>Anmelden</h1>
  <p class="muted">Vorstands-Dokumente</p>
  <form method="post">
    <label>Benutzer</label>
    <input type="text" name="username" autocomplete="username" placeholder="admin, redakteur oder leser" required autofocus>
    <label class="field-gap">Passwort</label>
    <input type="password" name="password" autocomplete="current-password" required>
    <button type="submit">Anmelden</button>
  </form>
</section>
{% endblock %}
